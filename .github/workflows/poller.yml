name: factory poller

# The only thing that starts work. This asks Jira which cards are waiting,
# dispatches the right workflow for each, and immediately moves the card out of
# the waiting status so the next pass does not pick it up again.
#
# Three sources, and the third is a different kind of thing. The two "Ready
# for …" columns are entered by a human moving a card, and the move is the
# instruction. The third is comment triage: every card the factory has put down
# and walked away from is checked for a comment newer than its own, and each
# new one is read to decide whether it is work, and for which agent. That is
# why the factory needs its own Jira account — "someone has spoken since we
# did" is only answerable if we are a distinct author — and it is why this job
# holds ANTHROPIC_API_KEY. See SECURITY.md for why that is not the same as
# giving an agent the key.
#
# It dispatches with the App token, not GITHUB_TOKEN: a workflow_dispatch made
# with GITHUB_TOKEN does not start a new workflow run.
#
# **Jira decides when this runs.** Two Automation rules on the project — one on
# "issue transitioned", one on "issue commented" — POST to this workflow's
# `dispatches` endpoint. See JIRA-TRIGGERS.md for the rules, the token they
# carry, and why that token's blast radius is smaller than "a GitHub token in
# Jira" sounds.
#
# That is why the `schedule:` below is commented out rather than deleted, and
# why the window now defaults to 0. Both were load-bearing under the old design,
# and the history matters for anyone thinking about turning them back on.
#
# The cron was never where latency came from. Five minutes is GitHub's floor for
# `schedule:`, and scheduled runs are routinely much later than that under load:
# measured over two days on this repository, scheduled starts came 1.4 to 5
# hours apart, so a 50-minute window left the factory unattended about 80% of
# the time and a card filed into the gap simply sat there. The fix then was for
# each run to dispatch the next one as its last act, which kept a runner up more
# or less continuously. That is free here because the repository is public. On a
# private one it bills every minute of it — about $345 a month — which is what
# made it the wrong shape to install anywhere else.
#
# A push trigger removes that problem instead of pricing it. A run is now a
# single pass: it starts because somebody moved a card or wrote a comment, does
# one sweep, and exits. Nothing is up between events.
#
# **The sweep is deliberately not aimed at the card that fired the rule.**
# Automation knows which issue it was and this workflow ignores it, because a
# full sweep makes a dropped event self-repairing — whatever one event missed,
# the next one picks up. A targeted dispatch would be marginally faster and
# would strand anything it failed to deliver.
#
# Restoring the old behaviour is two changes and no code: uncomment the
# `schedule:` block and set FACTORY_POLL_WINDOW_SECONDS to 3000. That is also
# the path onto a self-hosted runner, where the minutes stop costing anything
# and continuous polling becomes the cheapest option again rather than the
# dearest.
#
# Both knobs are repository variables, overridable per dispatch:
#   FACTORY_POLL_INTERVAL_SECONDS  seconds between passes      (default 30)
#   FACTORY_POLL_WINDOW_SECONDS    how long a run keeps going  (default 0)
#
# The window is clamped to 3000s below and cannot be raised past it by setting
# the variable — the App token is minted once per run and lasts an hour. A
# window of 0 is a single pass with no hand-over, which is the whole point now
# that Jira provides the coverage.

on:
  # Disabled on purpose: Jira triggers this now. Read the note above before
  # turning it back on — with the window at its new default of 0, a cron would
  # buy four passes an hour at GitHub's floor and still bill a minute a tick,
  # which is worse than the push trigger on both counts.
  #
  # Leaving it here rather than deleting it also leaves the fallback one
  # uncomment away, which matters because the push trigger depends on a token
  # held outside this repository.
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: Seconds between passes (blank = repository default)
        required: false
        default: ''
      window_seconds:
        description: How long this run keeps polling (blank = repository default)
        required: false
        default: ''

permissions:
  contents: read

# Under a push trigger this is also the debounce. Moving four cards at once
# fires four rules, and GitHub holds at most one pending run per group: the
# second arrival queues and each later one displaces it. So a burst collapses to
# "the run in flight, plus one more" — and since every run sweeps the whole
# board rather than one card, the pair of them covers the burst. Not
# `cancel-in-progress: true`, which would kill a run between the claim and the
# dispatch and leave a card claimed with nothing running.
concurrency:
  group: factory-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Dispatch waiting cards
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          # Read by `factory triage` and nothing else in this job. It is a
          # classifier call: no tools, a fixed prompt, and one of three words
          # back — not an agent, and it never sees the repository.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_TRIAGE_MODEL: ${{ vars.FACTORY_TRIAGE_MODEL }}
          POLL_INTERVAL: ${{ inputs.interval_seconds || vars.FACTORY_POLL_INTERVAL_SECONDS || '30' }}
          POLL_WINDOW: ${{ inputs.window_seconds || vars.FACTORY_POLL_WINDOW_SECONDS || '0' }}
        run: |
          set -euo pipefail

          # Both come from user-settable variables, so neither is trusted. A
          # non-numeric or zero interval would spin the loop as fast as Jira
          # will answer; the App token is minted once and lasts an hour, so a
          # window beyond that would keep polling with a dead token.
          case "$POLL_INTERVAL" in ''|*[!0-9]*) POLL_INTERVAL=30 ;; esac
          case "$POLL_WINDOW"   in ''|*[!0-9]*) POLL_WINDOW=0 ;; esac
          if (( POLL_INTERVAL < 5 )); then POLL_INTERVAL=5; fi
          if (( POLL_WINDOW > 3000 )); then
            echo "::warning::window of ${POLL_WINDOW}s exceeds the App token's life; clamped to 3000s. Coverage between runs comes from the hand-over at the end of this step, not from a longer window."
            POLL_WINDOW=3000
          fi

          # A card is sent in by putting it in the column AND assigning it to
          # the factory, so other cards can live on the same board untouched.
          # The poller runs as the factory's account, so currentUser() is the
          # bot. Triage, below, is the other shape: there the status says
          # nothing and the comment decides.
          dispatch() {
            waiting_status="$1"
            claimed_status="$2"
            workflow="$3"

            jql="project = ${JIRA_PROJECT_KEY} AND status = \"${waiting_status}\" AND assignee = currentUser() ORDER BY created ASC"
            keys="$(npm run --silent factory -- jira-search "$jql")"

            if [ -z "$keys" ]; then
              echo "none waiting in ${waiting_status}"
              return 0
            fi

            # Claim before dispatching, not after. If the claim succeeds and the
            # dispatch then fails, the card sits in ${claimed_status} with nothing
            # running — visible, and a human can re-run it. The other order would
            # hand the same card to a second agent on the next poll.
            #
            # The move is the claim, in the sense that matters here: it is the
            # status, and only the status, that stops the next pass picking the
            # same card up. The assignment below is the same claim said where a
            # person can see it, and is never allowed to affect either.
            # Deliberately unquoted: jira-search prints one issue key per line and
            # a key never contains whitespace, so word splitting is the iteration.
            # shellcheck disable=SC2086
            for key in $keys; do
              if ! npm run --silent factory -- jira-transition "$key" "$claimed_status"; then
                echo "::warning::could not move ${key} to ${claimed_status}; leaving it for the next poll"
                continue
              fi

              # Record who the card goes back to when the turn ends: whoever
              # dragged it into ${waiting_status}. The card is normally already
              # assigned to the factory, since that is how it was sent in, so
              # this is mostly the record; claimCard takes the avatar too if a
              # person unassigned it in the seconds since the search.
              #
              # After the transition, not before: by then the history holds the
              # drag and nothing after it but the factory's own move, which
              # sentInBy skips. This never fails the pass — claimCard warns and
              # returns — because a hand-back is not worth a card.
              npm run --silent factory -- jira-claim "$key" --from "$waiting_status" || true

              echo "dispatching ${workflow} for ${key}"
              if ! gh workflow run "$workflow" -f key="$key"; then
                echo "::error::${key} was claimed but ${workflow} could not be dispatched; re-run it by hand"
              fi
            done
          }

          deadline=$(( $(date +%s) + POLL_WINDOW ))
          pass=0

          while :; do
            pass=$(( pass + 1 ))
            echo "::group::pass $pass"
            dispatch "Ready for design" "Designing" design.yml
            dispatch "Ready for build"  "Building"  build-start.yml

            # Claims, comments and dispatches on its own — the order of those
            # four steps decides what a half-failure leaves behind, so it is
            # kept somewhere it can be tested rather than spread across this
            # shell. A failure inside one card is a warning, not an exit.
            npm run --silent factory -- triage || \
              echo "::warning::the triage pass failed; the next one will pick up the same comments"

            # A card in Designing or Building can only be moved by the factory
            # (ADR 0007), so one whose run died without reporting is stuck
            # there until something here lets it go.
            npm run --silent factory -- release-orphans || \
              echo "::warning::the orphan check failed; the next pass will look again"
            echo "::endgroup::"

            # Stop when the next pass would run past the window. The token is
            # the real deadline; see the clamp above.
            if (( $(date +%s) + POLL_INTERVAL >= deadline )); then
              echo "window closed after $pass pass(es)"
              break
            fi
            sleep "$POLL_INTERVAL"
          done

          # Hand over to the next run. Dead code on the default settings — a
          # window of 0 is a single pass on purpose, so it does not hand over,
          # and Jira starts the next run instead. It is kept whole because it is
          # half of the continuous mode, and the other half is one uncommented
          # `schedule:` away.
          #
          # This is deliberately the last statement of the step and deliberately
          # not a step of its own with `if: always()`: it must run when a window
          # completes and must not run when the loop died. A poller that
          # re-dispatches itself after a failure it is going to hit again
          # immediately is a loop that files a run every few seconds.
          #
          # A failed dispatch is a warning rather than an error: the run did its
          # whole job, and the next Jira event — or the cron, if it is on —
          # covers a dropped hand-over.
          if (( POLL_WINDOW > 0 )); then
            echo "handing over to the next run"
            gh workflow run poller.yml || \
              echo "::warning::could not dispatch the next poller run; the cron will restart the chain"
          fi
