name: factory poller

# The only thing that starts work. There are no Jira webhooks: this asks Jira
# which cards are waiting, dispatches the right workflow for each, and
# immediately moves the card out of the waiting status so the next pass does not
# pick it up again.
#
# Three sources, and the third is a different kind of thing. The two "Ready
# for …" columns are entered by a human moving a card, and the move is the
# instruction. The third is comment triage: every card the factory has put down
# and walked away from is checked for a comment newer than its own, and each
# new one is read to decide whether it is work, and for which agent. That is
# why the factory needs its own Jira account — "someone has spoken since we
# did" is only answerable if we are a distinct author — and it is why this job
# holds ANTHROPIC_API_KEY. See SECURITY.md for why that is not the same as
# giving an agent the key.
#
# It dispatches with the App token, not GITHUB_TOKEN: a workflow_dispatch made
# with GITHUB_TOKEN does not start a new workflow run.
#
# Latency does NOT come from the cron. Five minutes is GitHub's floor for
# `schedule:`, and scheduled runs are often much later than that under load. So
# one run polls repeatedly on a short interval for the length of a window. The
# setup — checkout, npm ci, minting the token — costs far more than a pass does,
# so passes within a run are close to free.
#
# **The run hands over to the next one itself.** This used to be the cron's job,
# on the assumption that `*/5` meant a fresh run was always due within five
# minutes of the last one ending. It does not. Measured over two days on this
# repository, scheduled starts came 1.4 to 5 hours apart, so a 50-minute window
# left the factory unattended about 80% of the time and a card filed into the
# gap simply sat there. The last thing a full window does now is dispatch the
# next run, which the concurrency group below queues behind this one; the cron
# is the safety net that restarts the chain if a run dies before reaching that
# line, not the thing providing coverage.
#
# That keeps a runner up more or less continuously. It is free here because the
# repository is public; on a private one it would bill every minute of it.
#
# Both knobs are repository variables, overridable per dispatch:
#   FACTORY_POLL_INTERVAL_SECONDS  seconds between passes      (default 30)
#   FACTORY_POLL_WINDOW_SECONDS    how long a run keeps going  (default 270)
#
# The window is clamped to 3000s below and cannot be raised past it by setting
# the variable — the App token is minted once per run and lasts an hour. Set the
# window to 0 for a single pass with no hand-over: the old behaviour, and the
# right setting if you do not want a runner up continuously.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: Seconds between passes (blank = repository default)
        required: false
        default: ''
      window_seconds:
        description: How long this run keeps polling (blank = repository default)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: factory-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Dispatch waiting cards
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          # Read by `factory triage` and nothing else in this job. It is a
          # classifier call: no tools, a fixed prompt, and one of three words
          # back — not an agent, and it never sees the repository.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_TRIAGE_MODEL: ${{ vars.FACTORY_TRIAGE_MODEL }}
          POLL_INTERVAL: ${{ inputs.interval_seconds || vars.FACTORY_POLL_INTERVAL_SECONDS || '30' }}
          POLL_WINDOW: ${{ inputs.window_seconds || vars.FACTORY_POLL_WINDOW_SECONDS || '270' }}
        run: |
          set -euo pipefail

          # Both come from user-settable variables, so neither is trusted. A
          # non-numeric or zero interval would spin the loop as fast as Jira
          # will answer; the App token is minted once and lasts an hour, so a
          # window beyond that would keep polling with a dead token.
          case "$POLL_INTERVAL" in ''|*[!0-9]*) POLL_INTERVAL=30 ;; esac
          case "$POLL_WINDOW"   in ''|*[!0-9]*) POLL_WINDOW=270 ;; esac
          if (( POLL_INTERVAL < 5 )); then POLL_INTERVAL=5; fi
          if (( POLL_WINDOW > 3000 )); then
            echo "::warning::window of ${POLL_WINDOW}s exceeds the App token's life; clamped to 3000s. Coverage between runs comes from the hand-over at the end of this step, not from a longer window."
            POLL_WINDOW=3000
          fi

          # Every card in the status is waiting for us, so the whole column is
          # dispatched. Triage, below, is the other shape: there the status
          # says nothing and the comment decides.
          dispatch() {
            waiting_status="$1"
            claimed_status="$2"
            workflow="$3"

            jql="project = ${JIRA_PROJECT_KEY} AND status = \"${waiting_status}\" ORDER BY created ASC"
            keys="$(npm run --silent factory -- jira-search "$jql")"

            if [ -z "$keys" ]; then
              echo "none waiting in ${waiting_status}"
              return 0
            fi

            # Claim before dispatching, not after. If the claim succeeds and the
            # dispatch then fails, the card sits in ${claimed_status} with nothing
            # running — visible, and a human can re-run it. The other order would
            # hand the same card to a second agent on the next poll.
            #
            # The move is the claim, in the sense that matters here: it is the
            # status, and only the status, that stops the next pass picking the
            # same card up. The assignment below is the same claim said where a
            # person can see it, and is never allowed to affect either.
            # Deliberately unquoted: jira-search prints one issue key per line and
            # a key never contains whitespace, so word splitting is the iteration.
            # shellcheck disable=SC2086
            for key in $keys; do
              if ! npm run --silent factory -- jira-transition "$key" "$claimed_status"; then
                echo "::warning::could not move ${key} to ${claimed_status}; leaving it for the next poll"
                continue
              fi

              # Take the avatar too, and take it here rather than leaving it to
              # `announce` inside the dispatched run. A status change and an
              # assignment are the same event — "the factory has this card" —
              # and splitting them put 18 to 44 seconds of unassigned Designing
              # on the board every time, with no end at all when the dispatch
              # below failed.
              #
              # After the transition, not before: the move is the step that can
              # legitimately fail, and a card left in "Ready for …" wearing the
              # bot's avatar would be a lie about a card the factory does not
              # have. This never fails the pass — claimCard warns and returns —
              # because an avatar is not worth a card.
              npm run --silent factory -- jira-claim "$key" || true

              echo "dispatching ${workflow} for ${key}"
              if ! gh workflow run "$workflow" -f key="$key"; then
                echo "::error::${key} was claimed but ${workflow} could not be dispatched; re-run it by hand"
              fi
            done
          }

          deadline=$(( $(date +%s) + POLL_WINDOW ))
          pass=0

          while :; do
            pass=$(( pass + 1 ))
            echo "::group::pass $pass"
            dispatch "Ready for design" "Designing" design.yml
            dispatch "Ready for build"  "Building"  build-start.yml

            # Claims, comments and dispatches on its own — the order of those
            # four steps decides what a half-failure leaves behind, so it is
            # kept somewhere it can be tested rather than spread across this
            # shell. A failure inside one card is a warning, not an exit.
            npm run --silent factory -- triage || \
              echo "::warning::the triage pass failed; the next one will pick up the same comments"
            echo "::endgroup::"

            # Stop when the next pass would run past the window. The token is
            # the real deadline; see the clamp above.
            if (( $(date +%s) + POLL_INTERVAL >= deadline )); then
              echo "window closed after $pass pass(es)"
              break
            fi
            sleep "$POLL_INTERVAL"
          done

          # Hand over to the next run. This is deliberately the last statement
          # of the step and deliberately not a step of its own with
          # `if: always()`: it must run when a window completes and must not run
          # when the loop died. A poller that re-dispatches itself after a
          # failure it is going to hit again immediately is a loop that files a
          # run every few seconds; one that stays down is picked up by the cron.
          #
          # A window of 0 is a single pass on purpose, so it does not hand over.
          #
          # A failed dispatch is a warning rather than an error: the run did its
          # whole job, and the cron covers a dropped hand-over.
          if (( POLL_WINDOW > 0 )); then
            echo "handing over to the next run"
            gh workflow run poller.yml || \
              echo "::warning::could not dispatch the next poller run; the cron will restart the chain"
          fi
