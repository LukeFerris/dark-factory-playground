name: factory build teardown

# Tears the preview down when a build PR closes, merged or not. Marks the
# Deployment inactive, then removes whatever the backend raised: the Container
# App and its image tag on Azure, or the pr-<n> package version on GHCR. A
# month of merged cards must not leave a month of running previews behind —
# on Azure that is a bill, not just clutter.
#
# Runs on the closed PR's own event, needs no agent, and holds no Anthropic key.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: factory-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  teardown:
    if: startsWith(github.event.pull_request.head.ref, 'card/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Sign in to Azure
        if: vars.FACTORY_PREVIEW_BACKEND == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Add the containerapp extension
        if: vars.FACTORY_PREVIEW_BACKEND == 'azure'
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Take the preview down
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_PREVIEW_BACKEND: ${{ vars.FACTORY_PREVIEW_BACKEND }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          AZURE_PREVIEW_REPOSITORY: ${{ vars.AZURE_PREVIEW_REPOSITORY }}
          AZURE_PREVIEW_PREFIX: ${{ vars.AZURE_PREVIEW_PREFIX }}
          AZURE_PREVIEW_IDENTITY: ${{ vars.AZURE_PREVIEW_IDENTITY }}
        run: npm run --silent factory -- preview-down "${{ github.event.pull_request.number }}"

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      # Dropping factory:active stops build-turn.yml from granting further turns
      # on a PR that is already closed.
      - name: Retire the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/labels/factory:active" \
            --silent || echo "factory:active was not set; nothing to remove."
