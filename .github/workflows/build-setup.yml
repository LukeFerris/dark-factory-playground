name: factory build setup

# The manual path for raising a preview. Nothing dispatches this — it is what
# a human runs when a turn's own preview job failed and the fix is "try the
# deploy again" rather than "run the turn again". See RUNBOOK.
#
# It used to run on `labeled` and `synchronize`, so the preview was raised by
# the pull request's own events, after the turn that produced the code had
# already finished and already told Jira. That is what put a card into "In
# review" pointing at a container that was still being built, and it is why
# turn 1's Jira comment could never carry a preview link: `report` ran in the
# other workflow, minutes earlier.
#
# Both triggers are therefore gone. build-start.yml and build-turn.yml each
# deploy in a second job of their own, before reporting. The invariant that
# replaces the old one is simpler to hold in your head:
#
#     a preview is raised by the turn that produced the code, never by a
#     pull request event.
#
# The cost is that a commit pushed to a card branch by hand no longer
# redeploys on its own. Run this workflow for that, which is the same thing a
# human would have to do anyway to check it worked.
#
# On `workflow_dispatch` the workflow file is read from the default branch and
# the *code* built is the PR's. That is inherent to previewing a branch. The
# boundary holding it is the same one the rest of the factory rests on:
# `factory validate` rejects any turn touching .github/, factory/, bootstrap/
# or .agent/ before it reaches the branch. No credential minted in this job is
# ever handed to an agent step.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: string
      kickoff:
        description: 'Also post the kickoff comment (only if turn 1 never did)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: factory-preview-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
      # `preview-up` writes the preview URL into the PR's factory block, which
      # is the copy that outlives this runner: every later build turn reads it
      # back from there. Editing a body needs this scope.
      pull-requests: write
    env:
      PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's head, not the merge commit Actions checks out by default.
          # A preview of a merge commit is a preview of something that exists
          # nowhere and that nobody asked to look at.
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Federated credentials — no Azure secret is stored in this repository.
      # The id-token: write permission above lets Actions mint a short-lived
      # OIDC token that Azure exchanges for one scoped to the preview resource
      # group. Skipped entirely when the backend is the GHCR stub.
      - name: Sign in to Azure
        if: vars.FACTORY_PREVIEW_BACKEND == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `az containerapp` ships as an extension. Adding it explicitly beats
      # relying on dynamic install, which prompts by default and so hangs.
      - name: Add the containerapp extension
        if: vars.FACTORY_PREVIEW_BACKEND == 'azure'
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Mint App token
        id: app-token
        if: inputs.kickoff
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      # There is no meta.json on this runner — this workflow is not a turn —
      # so `preview-up` records the URL on the pull request's factory block
      # only. That is the copy the next turn reads, which is what makes this a
      # usable retry: the turn that comes after picks the URL up from there.
      - name: Raise the preview
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          FACTORY_PREVIEW_BACKEND: ${{ vars.FACTORY_PREVIEW_BACKEND }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          AZURE_PREVIEW_REPOSITORY: ${{ vars.AZURE_PREVIEW_REPOSITORY }}
          AZURE_PREVIEW_PREFIX: ${{ vars.AZURE_PREVIEW_PREFIX }}
          AZURE_PREVIEW_IDENTITY: ${{ vars.AZURE_PREVIEW_IDENTITY }}
          AZURE_PREVIEW_COOLDOWN_SECONDS: ${{ vars.AZURE_PREVIEW_COOLDOWN_SECONDS }}
          AZURE_PREVIEW_LAUNCHER: ${{ vars.AZURE_PREVIEW_LAUNCHER }}
        # Waits for the preview to answer before returning, so a container
        # that never serves fails the job instead of being published as a
        # working link. Budget is three minutes.
        run: npm run --silent factory -- preview-up "${PR}"

      # Off by default. Turn 1 posts the kickoff comment itself, so running
      # this workflow as a retry would otherwise post a second one.
      - name: Post the kickoff comment
        if: inputs.kickoff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
          AZURE_PREVIEW_LAUNCHER: ${{ vars.AZURE_PREVIEW_LAUNCHER }}
        run: npm run --silent factory -- kickoff "${PR}"
