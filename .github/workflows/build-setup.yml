name: factory build setup

# Raises the preview for a build PR and posts the kickoff comment. Split out of
# build-start.yml because this is the only agent-adjacent job that needs
# packages: write and deployments: write, and those permissions must not be in
# scope while the agent is running.
#
# The preview is a stub: it builds app/Dockerfile, pushes it to GHCR as
# ghcr.io/<owner>/<repo>:pr-<n>, and records a GitHub Deployment in the
# `preview` environment pointing at the package. Nothing serves it. The real
# target is Azure Static Web Apps — see docs/factory/SELF-HOSTING.md and the
# commented job at the foot of this file.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factory-preview-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      # GITHUB_TOKEN carries the packages:write and deployments:write scopes
      # granted above; the App token is what comments as the factory identity.
      - name: Raise the preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: npm run --silent factory -- preview-up "${{ inputs.pr }}"

      - name: Post the kickoff comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
        run: npm run --silent factory -- kickoff "${{ inputs.pr }}"

# ---------------------------------------------------------------------------
# Real preview environment, not built for the POC.
#
# The stub above proves the plumbing — an image exists per PR and a Deployment
# records it — without standing up hosting. To serve the preview for real, add
