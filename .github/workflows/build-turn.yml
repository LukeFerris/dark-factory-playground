name: factory build turn

# One build turn. Auto-continue is off by design: the agent never grants itself
# the next turn, so a runaway loop costs one turn, not a night.
#
# One way in: `workflow_dispatch`, with the card's key. Three things send it:
#
#   build-comment.yml  a person commented on the pull request. The guards on
#                      who may grant a turn live there, along with the lookup
#                      from PR to card, because a run's concurrency group is
#                      worked out before any step runs and must already know
#                      the key.
#   triage             the poller read a comment on the *card* and decided it
#                      was work for the build agent.
#   refresh            main merged into the branch with a conflict, or merged
#                      cleanly and then failed a check.
#
# Every run is in the card's concurrency group, `factory-card-<KEY>`, which
# design.yml, build-start.yml and refresh's leg for the card share. So two of
# them never work one card at once: the second waits. GitHub keeps one waiting
# run per group, and a newer one replaces it, which loses nothing here: a turn
# reads the whole pull request conversation since the factory last spoke.
#
# The bot login comes from the FACTORY_BOT_LOGIN repository variable rather than
# being hard-coded, because the App slug is only known at Checkpoint A.
#
# Two jobs, for the reason set out in the header of build-start.yml: the agent
# job holds no registry, Azure or deployment credential, and `report` runs last
# so the card only reaches "In review" once the preview serving this turn's
# code has answered. A turn that redeploys after telling a human to go and look
# is a turn that shows them the previous turn's work.

run-name: ${{ inputs.key }} build turn

on:
  workflow_dispatch:
    inputs:
      key:
        description: Jira issue key, e.g. DF-4
        required: true

concurrency:
  group: factory-card-${{ inputs.key }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      validated: ${{ steps.validate.outcome }}
      branch: ${{ steps.pr.outputs.branch }}
      pr: ${{ steps.pr.outputs.number }}
      artifact: build-${{ steps.pr.outputs.key }}-turn${{ steps.gather.outputs.turn }}-${{ github.run_id }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      # The card's branch, matched on the `card/<KEY>-` prefix. The trailing
      # hyphen is load-bearing: without it DF-3 also matches card/DF-30-…
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail

          read -r pr branch <<<"$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq "[.[] | select(.head.ref | startswith(\"card/${KEY}-\"))][0] | \
                  if . == null then \"\" else \"\(.number) \(.head.ref)\" end")"
          if [ -z "${pr:-}" ]; then
            echo "::error::${KEY} was routed to a build turn but has no open pull request."
            exit 1
          fi
          key="$KEY"

          case "$branch" in
            card/*) ;;
            *) echo "::error::PR #${pr} is on ${branch}, which is not a card branch."; exit 1 ;;
          esac

          {
            echo "number=${pr}"
            echo "branch=${branch}"
            echo "key=${key}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A turn sent from a comment on the pull request finds its card in
      # review, where anyone can drag it. Moving it to Building locks it to the
      # factory until the turn reports (ADR 0007). Triage and refresh have
      # already moved theirs, so for those this only claims it.
      - name: Take the card
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: npm run --silent factory -- jira-take "${{ steps.pr.outputs.key }}" Building

      # The agent is told to run the walkthrough before it finishes a turn, and
      # `npm run e2e` cannot do that without a browser. Installed here rather
      # than left to the agent: `npx playwright install` is not on its
      # allow-list, and a turn whose evidence step fails for want of a download
      # would look like the app is broken.
      - name: Install the browser
        run: npx --workspace @factory/app playwright install --with-deps chromium

      # gather reads the PR conversation since the factory's last comment and
      # derives the turn number from it, so this step needs GitHub read access.
      - name: Gather the card and the conversation
        id: gather
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
        run: |
          set -euo pipefail
          npm run --silent factory -- gather "${{ steps.pr.outputs.key }}" \
            --stage build --pr "${{ steps.pr.outputs.number }}"
          echo "preview=$(jq -r '.preview_url // empty' .agent/in/meta.json)" >> "$GITHUB_OUTPUT"
          echo "turn=$(jq -r '.turn' .agent/in/meta.json)" >> "$GITHUB_OUTPUT"

      # Straight after gather, which is the step that derives the turn number.
      # The card has moved to Building by now, but this is what says why.
      - name: Say the turn has started
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: npm run --silent factory -- announce

      # Pinned deliberately, and the version and the model are pinned together.
      #
      # The flag surface is version-coupled — see the CHANGELOG entry for
      # --max-turns — so an unpinned install lets a CLI release change how a turn
      # behaves with nobody watching. The model is coupled in the other
      # direction: the API refuses a model the CLI is too old for, with
      # "Claude Code 2.1.224 does not support this model; version 2.1.280 or
      # newer is required". So raising FACTORY_AGENT_MODEL without raising
      # FACTORY_AGENT_VERSION fails every turn at its first API call, and the
      # two defaults have to move as a pair.
      - name: Install the agent
        run: npm i -g "@anthropic-ai/claude-code@${{ vars.FACTORY_AGENT_VERSION || '2.1.281' }}"

      # Before the merge, from main's installer, and after the agent. See
      # "Install the harness tools" in design.yml for why each.
      - name: Install the harness tools
        run: |
          set -euo pipefail
          echo "$HOME/.git-ai/bin" >> "$GITHUB_PATH"
          git show origin/main:scripts/install-harness-tools.sh > "$RUNNER_TEMP/install-harness-tools.sh"
          PATH="$HOME/.git-ai/bin:$PATH" bash "$RUNNER_TEMP/install-harness-tools.sh"

      # This branch is as old as the card, and a turn granted a week after the
      # last one is a week behind main. The merge commit stays local until
      # `publish` pushes it with the turn's own work.
      - name: Bring the branch up to main
        uses: ./.github/actions/merge-main
        with:
          key: ${{ steps.pr.outputs.key }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          jira-base: ${{ vars.JIRA_BASE }}
          jira-user: ${{ vars.JIRA_BOT_EMAIL }}
          jira-token: ${{ secrets.JIRA_BOT_TOKEN }}
          agent-model: ${{ vars.FACTORY_AGENT_MODEL || 'claude-opus-5-5' }}
          budget-usd: ${{ vars.FACTORY_MERGE_BUDGET_USD || '5' }}

      # ANTHROPIC_API_KEY and PREVIEW_URL. Nothing else — no App token, no Jira
      # token, no repository variables.
      - name: Agent
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW_URL: ${{ steps.gather.outputs.preview }}
        run: |
          set -euo pipefail
          mkdir -p .agent/out
          claude -p "$(cat .agent/build.md)" \
            --model "${{ vars.FACTORY_AGENT_MODEL || 'claude-opus-5-5' }}" \
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(npm run test:coverage:*),Bash(npm run e2e:*),Bash(npm run build:*),Bash(npm run preview:*),Bash(curl:*)" \
            --disallowedTools "WebFetch,WebSearch,Task,NotebookEdit" \
            --strict-mcp-config \
            --max-budget-usd "${{ vars.FACTORY_BUILD_BUDGET_USD || '10' }}" \
            --output-format json > .agent/out/transcript.json

      - name: Validate
        id: validate
        continue-on-error: true
        run: npm run --silent factory -- validate --stage build

      - name: Publish
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run --silent factory -- publish --stage build

      - name: Upload the turn
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ steps.pr.outputs.key }}-turn${{ steps.gather.outputs.turn }}-${{ github.run_id }}
          # Inputs as well as outputs. A turn is a pure function of .agent/in,
          # so shipping both is what makes a failed turn replayable locally.
          # It is also how the preview job gets meta.json and result.json,
          # which live on this runner and are gitignored.
          path: |
            .agent/in/
            .agent/out/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail the run if the turn was rejected
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error::The build turn was rejected by validation. See the Jira comment and the uploaded artifact."
          exit 1

  # Redeploys what this turn produced, waits for it to answer, and only then
  # tells Jira. See the header of build-start.yml for why this is a separate
  # job rather than more steps above. No kickoff comment: that is posted once
  # per pull request, by turn 1.
  preview:
    needs: turn
    # Not `always()`. The turn job carries the four comment guards above, and a
    # job those reject is *skipped* — which `always()` treats as reason to run,
    # so a comment from the bot would skip the agent and then report on a turn
    # that never happened. `!cancelled()` keeps the failed-turn path, which is
    # the one this job exists to cover.
    if: ${{ !cancelled() && needs.turn.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
      pull-requests: write
    env:
      DEPLOYABLE: ${{ needs.turn.outputs.validated == 'success' && needs.turn.outputs.pr != '' }}
      PR: ${{ needs.turn.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.turn.outputs.branch || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # .agent/ is gitignored, so meta.json and result.json reach this job only
      # here. `preview-up` then writes the URL back into the meta.json this
      # restores, which is how `report` below ends up with a preview link.
      - name: Restore the turn
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.turn.outputs.artifact }}
          path: .agent

      - name: Sign in to Azure
        if: env.DEPLOYABLE == 'true' && vars.FACTORY_PREVIEW_BACKEND == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Add the containerapp extension
        if: env.DEPLOYABLE == 'true' && vars.FACTORY_PREVIEW_BACKEND == 'azure'
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Raise the preview
        if: env.DEPLOYABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          FACTORY_PREVIEW_BACKEND: ${{ vars.FACTORY_PREVIEW_BACKEND }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          AZURE_PREVIEW_REPOSITORY: ${{ vars.AZURE_PREVIEW_REPOSITORY }}
          AZURE_PREVIEW_PREFIX: ${{ vars.AZURE_PREVIEW_PREFIX }}
          AZURE_PREVIEW_IDENTITY: ${{ vars.AZURE_PREVIEW_IDENTITY }}
          AZURE_PREVIEW_COOLDOWN_SECONDS: ${{ vars.AZURE_PREVIEW_COOLDOWN_SECONDS }}
          AZURE_PREVIEW_LAUNCHER: ${{ vars.AZURE_PREVIEW_LAUNCHER }}
        run: npm run --silent factory -- preview-up "${PR}"

      # Here, and not in the turn job, because this is the first moment a
      # preview of *this* turn's code exists: the agent's PREVIEW_URL comes
      # from `gather` and is the previous turn's, empty on turn 1. Evidence
      # taken there would show the wrong app.
      #
      # continue-on-error throughout. A finished card has to reach a reviewer
      # whether or not a browser could be installed, so the worst these three
      # steps do is leave the comment without pictures.
      - name: Install the browser and ffmpeg
        id: evidence-tools
        if: env.DEPLOYABLE == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          npx --workspace @factory/app playwright install --with-deps chromium
          # Debian's build has drawtext, which the slide captions need and
          # which is a build option rather than a given.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Walk the card in a browser
        if: env.DEPLOYABLE == 'true' && steps.evidence-tools.outcome == 'success'
        continue-on-error: true
        env:
          FACTORY_UAT_EVIDENCE: ${{ github.workspace }}/.agent/out/evidence
        run: |
          set -euo pipefail
          # Whatever the artifact carried, the evidence on the card has to be
          # this turn's.
          rm -rf "$FACTORY_UAT_EVIDENCE"
          # `preview-up` wrote the URL back into the meta.json restored above;
          # it is not a step output.
          FACTORY_E2E_BASE_URL="$(jq -r '.preview_url // empty' .agent/in/meta.json)"
          if [ -z "$FACTORY_E2E_BASE_URL" ]; then
            echo "::warning::No preview URL, so the walkthrough was not recorded."
            exit 0
          fi
          export FACTORY_E2E_BASE_URL
          npm run e2e --workspace @factory/app

      - name: Build the walkthrough
        if: env.DEPLOYABLE == 'true' && steps.evidence-tools.outcome == 'success'
        continue-on-error: true
        run: npm run --silent factory -- evidence-slides

      # The card is where the evidence is meant to land. This is the copy that
      # survives an attach that did not, and the one to look at when a
      # screenshot shows something nobody expected.
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ env.PR }}-${{ github.run_id }}
          path: .agent/out/evidence/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
          # The Jira comment's preview link is read by a person, possibly days
          # later when the app has long since scaled to zero, so it goes
          # through the launcher. meta.preview_url itself stays raw.
          AZURE_PREVIEW_LAUNCHER: ${{ vars.AZURE_PREVIEW_LAUNCHER }}
        run: npm run --silent factory -- report --stage build
