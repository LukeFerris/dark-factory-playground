name: factory build turn

# One build turn after the first, on the card's open pull request. Auto-continue
# is off by design: the agent never grants itself the next turn, so a runaway
# loop costs one turn, not a night.
#
# One way in: `workflow_dispatch`, with the card's key. Four things send it:
#
#   build-comment.yml  a person commented on the pull request. The guards on
#                      who may grant a turn live there, along with the lookup
#                      from PR to card, because a run's concurrency group is
#                      worked out before any step runs and must already know
#                      the key.
#   triage             the poller read a comment on the *card* and decided it
#                      was work for the build agent.
#   refresh            main merged into the branch with a conflict, or merged
#                      cleanly and then failed a check.
#   report             the last turn ended ready for review, and main's
#                      required checks then failed on what it pushed. Up to
#                      two of these in a row, counted by `retry`; after that
#                      the card goes to a person. The agent still grants
#                      itself nothing: the checks do, and only twice.
#
# The turn reads the whole pull request conversation since the factory last
# spoke, so a run that waits behind another on the same card loses nothing.
# The turn itself is turn.yml (ADR 0008).

run-name: ${{ inputs.key }} build turn

on:
  workflow_dispatch:
    inputs:
      key:
        description: Jira issue key, e.g. DF-4
        required: true
      retry:
        description: >-
          Which automatic turn this is, after required checks failed. Leave
          it at 0 when starting a turn by hand.
        required: false
        default: '0'

permissions:
  contents: read

# The card's group, shared with design.yml, build-start.yml and refresh's leg
# for the card. GitHub keeps one waiting run per group, and a newer one
# replaces it (ADR 0007).
concurrency:
  group: factory-card-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  turn:
    # The most any job in turn.yml asks for. A called workflow can only narrow
    # what its caller grants, and GitHub checks every job's request against
    # this when the run starts, whether or not the job will run. Each job in
    # turn.yml then asks for only what it needs: the agent's, contents: read.
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    uses: ./.github/workflows/turn.yml
    with:
      key: ${{ inputs.key }}
      stage: build
      continues: true
      retry: ${{ fromJSON(inputs.retry || '0') }}
    secrets: inherit
