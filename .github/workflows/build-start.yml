name: factory build start

# Turn 1 of a build. Dispatched by the poller when a card reaches "Ready for
# build". Cuts the build/* branch, runs the first turn against the approved
# design, opens the draft PR, and then hands off to build-setup to raise the
# preview and post the kickoff comment.
#
# Every later turn is granted by a human comment and runs in build-turn.yml.
# There is no auto-continue.

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Jira issue key, e.g. DF-14'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factory-build-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  build-start:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Gather the card
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
        run: npm run --silent factory -- gather "${{ inputs.key }}" --stage build

      - name: Prepare the branch
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: npm run --silent factory -- prepare-branch "${{ inputs.key }}" --stage build

      - name: Install the agent
        run: npm i -g @anthropic-ai/claude-code

      # ANTHROPIC_API_KEY is the only credential here. PREVIEW_URL is empty on
      # turn 1 — there is nothing deployed until build-setup runs.
      #
      # The Bash allow-list is the four checks plus preview and curl. npm install
      # is deliberately absent: to add a dependency the agent edits
      # app/package.json and `factory publish` regenerates the lockfile.
      - name: Agent
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW_URL: ''
        run: |
          set -euo pipefail
          mkdir -p .agent/out
          claude -p "$(cat .agent/build.md)" \
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(npm run lint:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(npm run build:*),Bash(npm run preview:*),Bash(curl:*)" \
            --disallowedTools "WebFetch,WebSearch,Task,NotebookEdit" \
            --strict-mcp-config \
            --max-budget-usd "${{ vars.FACTORY_BUILD_BUDGET_USD || '10' }}" \
            --output-format json > .agent/out/transcript.json

      - name: Validate
        id: validate
        continue-on-error: true
        run: npm run --silent factory -- validate --stage build --base origin/main

      - name: Mint App token
        id: app-token
        if: steps.validate.outcome == 'success'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Publish
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run --silent factory -- publish --stage build

      - name: Read the PR number
        id: pr
        if: always()
        run: |
          set -euo pipefail
          pr="$(jq -r '.pr // empty' .agent/in/meta.json 2>/dev/null || true)"
          echo "number=${pr}" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: npm run --silent factory -- report --stage build

      - name: Upload the turn
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.key }}-turn1-${{ github.run_id }}
          path: .agent/out/
          retention-days: 14
          if-no-files-found: warn

      # Raising the preview needs packages: write and deployments: write, which
      # this job deliberately does not have. build-setup.yml has them instead.
      - name: Hand off to build-setup
        if: steps.validate.outcome == 'success' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run build-setup.yml -f pr="${{ steps.pr.outputs.number }}"

      - name: Fail the run if the turn was rejected
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error::The build turn was rejected by validation. See the Jira comment and the uploaded artifact."
          exit 1
