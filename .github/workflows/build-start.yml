name: factory build start

# Turn 1 of a build. Dispatched by the poller when a card reaches "Ready for
# build". Cuts the card's branch, or carries on from its design, runs the first
# turn against the approved design, opens the draft PR, raises the preview, and
# only then tells Jira.
#
# Every later turn is granted by a person and runs in build-turn.yml. There is
# no auto-continue. Both are turn.yml, whose header says how the agent is kept
# apart from every token the factory holds (ADR 0008), and why the card only
# reaches "In review" once the preview has answered (ADR 0003).

run-name: ${{ inputs.key }} build turn 1

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Jira issue key, e.g. DF-14'
        required: true
        type: string

permissions:
  contents: read

# The card's group, shared with design.yml, build-turn.yml and refresh's leg
# for the card, so that two runs never work one card at once (ADR 0007).
concurrency:
  group: factory-card-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  turn:
    # The most any job in turn.yml asks for. A called workflow can only narrow
    # what its caller grants, and GitHub checks every job's request against
    # this when the run starts, whether or not the job will run. Each job in
    # turn.yml then asks for only what it needs: the agent's, contents: read.
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/turn.yml
    with:
      key: ${{ inputs.key }}
      stage: build
    secrets: inherit
