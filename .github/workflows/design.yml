name: factory design

# One design turn. Dispatched by the poller when a card reaches "Ready for
# design". Produces docs/design/<KEY>/design.md on a design/* branch and a draft
# PR, then reports the outcome to Jira.
#
# The Agent step holds ANTHROPIC_API_KEY and nothing else. Everything that can
# write to GitHub or Jira runs in a later step with its own env block.

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Jira issue key, e.g. DF-14'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factory-design-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The validator diffs against origin/main, so it needs real history.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Gather the card
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
        run: npm run --silent factory -- gather "${{ inputs.key }}" --stage design

      - name: Prepare the branch
        env:
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: npm run --silent factory -- prepare-branch "${{ inputs.key }}" --stage design

      # Pinned deliberately. The flag surface is version-coupled — see the
      # CHANGELOG entry for --max-turns — so an unpinned install lets a CLI
      # release change how a turn behaves with nobody watching.
      - name: Install the agent
        run: npm i -g "@anthropic-ai/claude-code@${{ vars.FACTORY_AGENT_VERSION || '2.1.224' }}"

      # No GitHub token, no Jira token, no repository variables. The agent reads
      # its manual and .agent/in, and writes .agent/out. Tools are allow-listed;
      # Bash is denied outright, so a design turn cannot run anything at all.
      - name: Agent
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .agent/out
          claude -p "$(cat .agent/design.md)" \
            --allowedTools "Read,Glob,Grep,Write,Edit" \
            --disallowedTools "Bash,WebFetch,WebSearch,Task,NotebookEdit" \
            --strict-mcp-config \
            --max-budget-usd "${{ vars.FACTORY_DESIGN_BUDGET_USD || '5' }}" \
            --output-format json > .agent/out/transcript.json

      - name: Validate
        id: validate
        continue-on-error: true
        run: npm run --silent factory -- validate --stage design --base origin/main

      - name: Mint App token
        id: app-token
        if: steps.validate.outcome == 'success'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Publish
        id: publish
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          npm run --silent factory -- publish --stage design

      # Always runs: a rejected turn still has to land on the card, otherwise it
      # sits in "Designing" with nobody told why.
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          JIRA_BASE: ${{ vars.JIRA_BASE }}
          JIRA_USER: ${{ vars.JIRA_BOT_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_BOT_TOKEN }}
        run: npm run --silent factory -- report --stage design

      - name: Upload the turn
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-${{ inputs.key }}-${{ github.run_id }}
          # Inputs as well as outputs. A turn is a pure function of .agent/in,
          # so shipping both is what makes a failed turn replayable locally.
          path: |
            .agent/in/
            .agent/out/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail the run if the turn was rejected
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error::The design turn was rejected by validation. See the Jira comment and the uploaded artifact."
          exit 1
