name: factory design

# One design turn. Dispatched by the poller when a card reaches "Ready for
# design", and by triage. Produces docs/design/<KEY>/design.md on the card's
# branch and a draft PR, then reports the outcome to Jira.
#
# The turn itself is turn.yml, shared with the build turns. Its header says how
# the agent is kept apart from every token the factory holds (ADR 0008).

run-name: ${{ inputs.key }} design turn

on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Jira issue key, e.g. DF-14'
        required: true
        type: string

permissions:
  contents: read

# The card's group, shared with build-start.yml, build-turn.yml and refresh's
# leg for the card, so that two runs never work one card at once (ADR 0007).
concurrency:
  group: factory-card-${{ inputs.key }}
  cancel-in-progress: false

jobs:
  turn:
    # The most any job in turn.yml asks for. A called workflow can only narrow
    # what its caller grants, and GitHub checks every job's request against
    # this when the run starts, whether or not the job will run. Each job in
    # turn.yml then asks for only what it needs: the agent's, contents: read.
    permissions:
      contents: read
      packages: write
      deployments: write
      id-token: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/turn.yml
    with:
      key: ${{ inputs.key }}
      stage: design
    secrets: inherit
