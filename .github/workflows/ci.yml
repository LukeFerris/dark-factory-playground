name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails on a lockfile that disagrees with package.json. That is
      # the intended guard on a build turn that adds a dependency.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The checked-in result contract must match what factory/src/schema.ts
      # generates, or the agent is validating against a stale schema.
      - name: Check result schema is not stale
        run: |
          npm run --silent factory -- emit-schema
          git diff --exit-code -- .agent/result.schema.json
